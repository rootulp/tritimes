name: Site (Cloudflare)

# Builds, tests, and deploys the static site in site/ to Cloudflare Workers
# Static Assets. PRs get a preview URL; merges to main deploy production.
# Deploy steps are skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID
# repository secrets exist (and on fork PRs, which don't receive secrets).

on:
  pull_request:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/site.yml"]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E against the built site (wrangler dev)
        run: npx playwright test

      - name: Deploy preview
        if: github.event_name == 'pull_request' && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler versions upload --preview-alias "pr-${{ github.event.number }}" | tee upload.log
          url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' upload.log | head -n1)
          echo "Preview: ${url}" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production
        if: github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
