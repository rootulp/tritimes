name: Site (Cloudflare)

on:
  pull_request:
    branches: [main]
    paths: ["site/**", "app/src/lib/**", "data/**", "scripts/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/site.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deployment destination (production requires an explicit dispatch)
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run verify:assets
      - name: Build original data artifacts as the parity oracle
        run: npm run audit:prepare
      - name: Audit the full corpus against the original implementation
        run: npm run audit
      - run: npx playwright install --with-deps chromium
      - name: Browser parity against Cloudflare's local runtime
        run: npm run e2e -- --reporter=list,html
      - name: Repeat mobile browser measurements
        run: |
          npm run preview > /tmp/tritimes-preview.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:8787/robots.txt")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
          npm run benchmark
          npm run performance:report
      - name: Independent mobile Lighthouse audits
        run: npm run lighthouse
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-evidence-${{ github.run_id }}
          path: |
            site/artifacts/
            site/playwright-report/
            site/test-results/
          retention-days: 7

      # Only these deployment steps receive credentials. Fork PRs receive none.
      # Each PR gets its own static-only Worker; main pushes update a preview.
      - name: Deploy isolated preview
        if: github.event_name != 'workflow_dispatch' || inputs.deploy == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: tritimes-preview${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.number) || '' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Preview skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler deploy --name "$PREVIEW_NAME" | tee /tmp/tritimes-deploy.log
          sed -n '/https:.*workers.dev/p' /tmp/tritimes-deploy.log >> "$GITHUB_STEP_SUMMARY"

      # Merging this PR does not change the production site. Dispatch manually
      # only after reviewing the preview and arranging the DNS cutover.
      - name: Deploy production (explicit manual dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'production' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
