name: Site (Cloudflare)

on:
  pull_request:
    branches: [main]
    paths: ["site/**", "app/src/lib/**", "data/**", "scripts/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "data/**", "scripts/**", ".github/workflows/site.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deployment destination (main pushes also deploy production)
        type: choice
        options: [preview, production, inspect-domains, prepare-redirect, cutover-domains, publish-verified-production]
        default: preview

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish-verified-production:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'publish-verified-production'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
        with:
          # Exact application commit already verified on the owned preview.
          ref: f92916520a1c2571350a36bec01f439eb97dcec1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run verify:assets
      - name: Publish the verified application as production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name tritimes
  inspect-domains:
    if: github.event_name == 'workflow_dispatch' && (inputs.deploy == 'inspect-domains' || inputs.deploy == 'prepare-redirect' || inputs.deploy == 'cutover-domains')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the zone or prepare the authorized apex redirect
        env:
          MODE: ${{ inputs.deploy }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['CLOUDFLARE_API_TOKEN']
          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          def get(path, method="GET", payload=None):
              request = urllib.request.Request('https://api.cloudflare.com/client/v4' + path,
                  headers={'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
                  method=method, data=json.dumps(payload).encode() if payload is not None else None)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as error:
                  body = json.load(error)
                  raise RuntimeError(json.dumps({'status': error.code, 'errors': body.get('errors')})) from None
              if not body.get('success'):
                  raise RuntimeError(json.dumps(body.get('errors')))
              return body['result']
          zones = get('/zones?name=tritimes.org&account.id=' + account)
          if len(zones) != 1:
              raise RuntimeError('Expected exactly one tritimes.org zone in the deployment account')
          zone = zones[0]
          records = []
          for name in ['tritimes.org', 'www.tritimes.org']:
              records += get('/zones/' + zone['id'] + '/dns_records?name=' + name)
          print(json.dumps({'zone': zone['name'], 'status': zone['status'], 'records': [
              {key: record.get(key) for key in ['type', 'name', 'content', 'proxied', 'ttl']}
              for record in records if record['type'] in ['A', 'AAAA', 'CNAME']
          ]}, indent=2))
          try:
              rules = get('/zones/' + zone['id'] + '/rulesets/phases/http_request_dynamic_redirect/entrypoint')
              print(json.dumps({'redirectRulesAccess': True, 'rules': rules.get('rules', [])}, indent=2))
          except RuntimeError as error:
              print('Redirect rules inspection:', str(error))
          if os.environ['MODE'] == 'prepare-redirect':
              endpoint = '/zones/' + zone['id'] + '/rulesets/phases/http_request_dynamic_redirect/entrypoint'
              try:
                  existing = get(endpoint)
              except RuntimeError as error:
                  if '"status": 404' not in str(error):
                      raise
                  existing = None
              if existing:
                  raise RuntimeError('An existing redirect ruleset needs review; no changes made')
              result = get('/zones/' + zone['id'] + '/rulesets', 'POST', {
                  'name': 'TriTimes redirects', 'kind': 'zone', 'phase': 'http_request_dynamic_redirect',
                  'rules': [{
                      'description': 'TriTimes apex to www', 'enabled': True,
                      'expression': '(http.host eq "tritimes.org")', 'action': 'redirect',
                      'action_parameters': {'from_value': {
                          'status_code': 307,
                          'target_url': {'expression': 'concat("https://www.tritimes.org", http.request.uri.path)'},
                          'preserve_query_string': True
                      }}
                  }]
              })
              print('Apex-to-www redirect prepared. DNS records are unchanged; the rule only applies once proxied.')
          elif os.environ['MODE'] == 'cutover-domains':
              import pathlib
              # The application was verified separately with 40 real browser tests.
              # Use the authenticated control plane here: workers.dev may challenge
              # GitHub's Python HTTP client even when normal browsers can load it.
              deployment = get('/accounts/' + account + '/workers/scripts/tritimes/deployments')
              if not deployment.get('deployments'):
                  raise RuntimeError('Production Worker has no active deployment')
              rules = get('/zones/' + zone['id'] + '/rulesets/phases/http_request_dynamic_redirect/entrypoint')
              if not any(rule.get('enabled') and rule.get('expression') == '(http.host eq "tritimes.org")'
                         and rule.get('action_parameters', {}).get('from_value', {}).get('preserve_query_string')
                         and rule.get('action_parameters', {}).get('from_value', {}).get('target_url', {}).get('expression')
                             == 'concat("https://www.tritimes.org", http.request.uri.path)'
                         for rule in rules.get('rules', [])):
                  raise RuntimeError('The apex-to-www redirect must be configured before DNS cutover')
              https_expression = '(http.host eq "www.tritimes.org" and starts_with(http.request.full_uri, "http://"))'
              if not any(rule.get('enabled') and rule.get('expression') == https_expression for rule in rules.get('rules', [])):
                  get('/zones/' + zone['id'] + '/rulesets/' + rules['id'] + '/rules', 'POST', {
                      'description': 'TriTimes www HTTP to HTTPS', 'enabled': True,
                      'expression': https_expression, 'action': 'redirect',
                      'action_parameters': {'from_value': {
                          'status_code': 307,
                          'target_url': {'expression': 'concat("https://www.tritimes.org", http.request.uri.path)'},
                          'preserve_query_string': True
                      }}
                  })
                  print('Prepared www HTTP-to-HTTPS redirect with path and query preservation.')
              domains_path = '/accounts/' + account + '/workers/domains'
              domains = get(domains_path)
              names = ['www.tritimes.org', 'tritimes.org']
              backup = {name: [record for record in records if record['name'] == name
                        and record['type'] in ['A', 'AAAA', 'CNAME']] for name in names}
              for name in names:
                  attached = next((item for item in domains if item['hostname'] == name), None)
                  if attached:
                      if attached['service'] != 'tritimes':
                          raise RuntimeError(name + ' is attached to another Worker; refusing to change it')
                      continue
                  old = backup[name]
                  if len(old) != 1 or old[0]['type'] != 'CNAME' or old[0]['content'].rstrip('.') != 'a2052866c44486e9.vercel-dns-017.com':
                      raise RuntimeError(name + ': expected exactly the recorded Vercel CNAME; no DNS changed')
              pathlib.Path('/tmp/tritimes-cutover.json').write_text(json.dumps({'previousRecords': backup}, indent=2))
              print('Saved the original apex/www DNS records before changing anything.')
              for name in names:
                  if any(item['hostname'] == name and item['service'] == 'tritimes' for item in domains):
                      print(name + ': already attached to tritimes')
                      continue
                  old = backup[name][0]
                  dns_path = '/zones/' + zone['id'] + '/dns_records'
                  get(dns_path + '/' + old['id'], 'DELETE')
                  try:
                      attached = get(domains_path, 'PUT', {
                          'hostname': name, 'service': 'tritimes', 'enabled': True,
                          'zone_name': 'tritimes.org'
                      })
                  except Exception:
                      # Reconcile an ambiguous API failure before restoring DNS.
                      current = get(domains_path)
                      if not any(item['hostname'] == name and item['service'] == 'tritimes' for item in current):
                          restore = {key: old[key] for key in ['type', 'name', 'content', 'proxied', 'ttl', 'comment', 'tags', 'settings']
                                     if key in old and old[key] is not None}
                          get(dns_path, 'POST', restore)
                          print(name + ': restored the original Vercel DNS record after attachment failed')
                          raise
                  print(name + ': attached to the production tritimes Worker')
              final = get(domains_path)
              for name in names:
                  if not any(item['hostname'] == name and item['service'] == 'tritimes' for item in final):
                      raise RuntimeError('Unable to confirm custom domain: ' + name)
              print('Both domains attached. Public DNS/HTTPS/browser checks are still required.')
          else:
              print('Inspection only: no DNS records or domains were changed.')
          PY
      - name: Save DNS rollback records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tritimes-cutover-${{ github.run_id }}
          path: /tmp/tritimes-cutover.json
          if-no-files-found: ignore
          retention-days: 30
  live-preview:
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.body, 'Preview URL: https://')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Read the explicitly linked Cloudflare preview
        id: preview
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const match = /^Preview URL: (https:\/\/(?:[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev|(?:[a-z0-9-]+\.)*tritimes\.org))\/?$/m.exec(process.env.PR_BODY ?? '');
          if (!match) throw new Error('Preview URL must be an HTTPS workers.dev or tritimes.org origin on its own line');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${match[1]}\n`);
          JS
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check live browser response before interaction tests
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: |
          node --input-type=module <<'JS'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch();
          try {
            const page = await browser.newPage();
            page.on('pageerror', error => console.log('Browser error:', error.message));
            page.on('requestfailed', request => console.log('Failed request:', request.url(), request.failure()?.errorText));
            const response = await page.goto(process.env.BASE_URL, { waitUntil: 'load', timeout: 30000 });
            const title = await page.title();
            const body = (await page.locator('body').innerText()).slice(0, 1500);
            console.log(JSON.stringify({ status: response?.status(), title, body }, null, 2));
            if (response?.status() !== 200 || !title.includes('TriTimes')) throw new Error('Preview did not return the TriTimes page');
          } finally { await browser.close(); }
          JS
      - name: Browser parity on the actual Cloudflare CDN
        env:
          BASE_URL: ${{ steps.preview.outputs.url }}
        run: npm run e2e -- --reporter=list,html --max-failures=1
      - name: Upload live browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-live-browser-${{ github.run_id }}
          path: |
            site/playwright-report/
            site/test-results/
          retention-days: 7

  site:
    if: github.event_name != 'workflow_dispatch' || (inputs.deploy != 'inspect-domains' && inputs.deploy != 'prepare-redirect' && inputs.deploy != 'cutover-domains' && inputs.deploy != 'publish-verified-production')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      WRANGLER_SEND_METRICS: false
      GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
      PUBLIC_CF_BEACON_TOKEN: ${{ vars.PUBLIC_CF_BEACON_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check
      - run: npm run verify:assets
      - name: Build original data artifacts as the parity oracle
        run: npm run audit:prepare
      - name: Audit the full corpus against the original implementation
        run: npm run audit
      - run: npx playwright install --with-deps chromium
      - name: Browser parity against Cloudflare's local runtime
        run: npm run e2e -- --reporter=list,html
      - name: Repeat mobile browser measurements
        run: |
          npm run preview > /tmp/tritimes-preview.log 2>&1 &
          node --input-type=module -e 'for(let i=0;i<60;i++){try{if((await fetch("http://127.0.0.1:8787/robots.txt")).ok)process.exit(0)}catch{}await new Promise(r=>setTimeout(r,1000))}process.exit(1)'
          npm run benchmark
          npm run performance:report
      - name: Independent mobile Lighthouse audits
        run: npm run lighthouse
      - name: Upload reproducible evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-evidence-${{ github.run_id }}
          path: |
            site/artifacts/
            site/playwright-report/
            site/test-results/
          retention-days: 7

      # Only these deployment steps receive credentials. Fork PRs receive none.
      # Each PR gets its own static-only Worker; main pushes update a preview.
      - name: Deploy isolated preview
        if: github.event_name != 'workflow_dispatch' || inputs.deploy == 'preview'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_NAME: tritimes-preview${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.number) || '' }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo 'Preview skipped: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          npx wrangler deploy --name "$PREVIEW_NAME" | tee /tmp/tritimes-deploy.log
          sed -n '/https:.*workers.dev/p' /tmp/tritimes-deploy.log >> "$GITHUB_STEP_SUMMARY"

      # Main pushes deploy production so daily scraper merges reach the live site.
      - name: Deploy production
        if: >-
          github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.deploy == 'production') ||
          github.event_name == 'push')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
